<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Dark Frutiger Aero mode">
  <defs>
    <!-- Green Gloss #1: #9dd53a 0%, #a1d54f 50%, #80c217 51%, #7cbc0a 100% -->
    <linearGradient id="fd-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9dd53a"/>
      <stop offset="50%" stop-color="#a1d54f"/>
      <stop offset="51%" stop-color="#80c217"/>
      <stop offset="100%" stop-color="#7cbc0a"/>
    </linearGradient>
    <!-- Black Gloss: the dark half of the glass the orb sits in -->
    <radialGradient id="fd-sphere" cx="34%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#c9e39a"/>
      <stop offset="34%" stop-color="#7fb02a"/>
      <stop offset="68%" stop-color="#3d6b06"/>
      <stop offset="100%" stop-color="#14240a"/>
    </radialGradient>
    <linearGradient id="fd-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".3"/>
      <stop offset="51%" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fd-spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fd-clip"><circle cx="12" cy="12" r="8.4"/></clipPath>
  </defs>
  <circle cx="12" cy="12" r="9.1" fill="#0a0e0a"/>
  <circle cx="12" cy="12" r="8.4" fill="url(#fd-sphere)"/>
  <rect x="3" y="3.2" width="18" height="6.6" fill="url(#fd-gloss)" clip-path="url(#fd-clip)"/>
  <ellipse cx="9.3" cy="8.4" rx="2.7" ry="1.7" fill="url(#fd-spec)"/>
  <circle cx="12" cy="12" r="8.4" fill="none" stroke="url(#fd-body)" stroke-width=".8"/>
</svg>