<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Dark mode">
  <defs>
    <!-- crescent geometry: a 9-radius disc with a 5.4-radius bite out of the top right -->
    <path id="sd-shape" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
    <radialGradient id="sd-body" cx="34%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#f4f8ff"/>
      <stop offset="26%" stop-color="#c3d6f2"/>
      <stop offset="62%" stop-color="#7f9ccd"/>
      <stop offset="86%" stop-color="#4a6a9e"/>
      <stop offset="100%" stop-color="#22334f"/>
    </radialGradient>
    <!-- the hard gloss band, clipped to the crescent so it follows the shape -->
    <linearGradient id="sd-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sd-spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sd-clip"><use href="#sd-shape"/></clipPath>
  </defs>
  <use href="#sd-shape" fill="url(#sd-body)"/>
  <rect x="2" y="2.4" width="20" height="6" fill="url(#sd-gloss)" clip-path="url(#sd-clip)"/>
  <ellipse cx="8.4" cy="9.2" rx="3" ry="1.9" fill="url(#sd-spec)" clip-path="url(#sd-clip)"/>
</svg>
