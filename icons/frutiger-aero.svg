<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Frutiger Aero">
  <defs>
    <!-- translucent green glass, highlight up-left like the Frutiger Aero orbs -->
    <radialGradient id="fa-body" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#f2ffe8"/>
      <stop offset="18%" stop-color="#bdf59e"/>
      <stop offset="46%" stop-color="#7fe06a"/>
      <stop offset="72%" stop-color="#3fbf40"/>
      <stop offset="100%" stop-color="#0c4414"/>
    </radialGradient>
    <radialGradient id="fa-small" cx="36%" cy="30%" r="76%">
      <stop offset="0%" stop-color="#e8ffd9"/>
      <stop offset="30%" stop-color="#9fec8a"/>
      <stop offset="70%" stop-color="#3fbf40"/>
      <stop offset="100%" stop-color="#14601d"/>
    </radialGradient>
    <!-- light wrapping the lower-right of a soap bubble -->
    <linearGradient id="fa-rim" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2f7b0" stop-opacity="0"/>
      <stop offset="55%" stop-color="#c2f7b0" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="fa-spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="38.5" cy="35.5" r="8.5" fill="url(#fa-small)"/>
  <ellipse cx="35.6" cy="32.2" rx="2.9" ry="2" fill="url(#fa-spec)" opacity=".8"/>
  <circle cx="21" cy="22" r="16" fill="url(#fa-body)"/>
  <circle cx="21" cy="22" r="15.1" fill="none" stroke="url(#fa-rim)" stroke-width="1.5" opacity=".75"/>
  <ellipse cx="16.4" cy="15.6" rx="5.2" ry="3.6" fill="url(#fa-spec)"/>
</svg>
