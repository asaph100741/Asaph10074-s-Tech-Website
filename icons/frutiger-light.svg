<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Light Frutiger Aero mode">
  <defs>
    <!-- Green Gloss: #bfd255 0%, #8eb92a 50%, #72aa00 51%, #9ecb2d 100% -->
    <linearGradient id="fl-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfd255"/>
      <stop offset="50%" stop-color="#8eb92a"/>
      <stop offset="51%" stop-color="#72aa00"/>
      <stop offset="100%" stop-color="#9ecb2d"/>
    </linearGradient>
    <radialGradient id="fl-sphere" cx="34%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#e6f0a3"/>
      <stop offset="38%" stop-color="#bfd255"/>
      <stop offset="72%" stop-color="#8eb92a"/>
      <stop offset="100%" stop-color="#4c7000"/>
    </radialGradient>
    <!-- White Gloss: the hard specular band across the top of the orb -->
    <linearGradient id="fl-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".78"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset="51%" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fl-spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".98"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fl-clip"><circle cx="12" cy="12" r="8.4"/></clipPath>
  </defs>
  <circle cx="12" cy="12" r="9.1" fill="url(#fl-body)" opacity=".55"/>
  <circle cx="12" cy="12" r="8.4" fill="url(#fl-sphere)"/>
  <rect x="3" y="3.2" width="18" height="6.6" fill="url(#fl-gloss)" clip-path="url(#fl-clip)"/>
  <ellipse cx="9.3" cy="8.4" rx="2.9" ry="1.8" fill="url(#fl-spec)"/>
  <circle cx="12" cy="12" r="8.4" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width=".7"/>
</svg>