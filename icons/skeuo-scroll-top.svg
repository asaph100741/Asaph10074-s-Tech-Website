<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" role="img" aria-label="Scroll to top">
  <defs>
    <!-- opaque, saturated, hard-edged: the skeuomorphic tell, not a flat glyph.
         Four stops on the same 0 / 12 / 55 / 100 bevel ramp skeuo-light.svg
         already uses, and the same blue family as the netshell arrows, so the
         two glass-adjacent themes read as siblings while skeuo stays chunkier. -->
    <linearGradient id="sstBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe9ff"/>
      <stop offset="12%" stop-color="#7fbdec"/>
      <stop offset="55%" stop-color="#2f7cba"/>
      <stop offset="100%" stop-color="#0d3a63"/>
    </linearGradient>
  </defs>
  <path fill="url(#sstBody)" stroke="#0b1c2b" stroke-width="1.5" stroke-linejoin="round" d="M9.75 21.4h4.5V12h5.75L12 2.6 4 12h5.75z"/>
  <!-- the hard gloss sliver along the top face -->
  <path fill="#ffffff" opacity=".62" d="M6.55 12 12 5.05 17.45 12h-2.7L12 8.6 9.25 12z"/>
</svg>
